[workspace]
resolver = "3"
members = [
    "crates/aegis-core",
    "crates/aegis-gateway",
    "crates/aegis-mcp",
    "crates/aegis-tools",
    "crates/aegis-sandbox",
    "crates/aegis-scope",
    "crates/aegis-validate",
    "crates/aegis-kg",
    "crates/aegis-knowledge",
    "crates/aegis-blue",
    "crates/aegis-evidence",
    "crates/aegis-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["hydralabs deathworks team"]
repository = "https://github.com/AzazelDeathWorks/melissacyber"
homepage = "https://github.com/AzazelDeathWorks/melissacyber"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
